<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ô Chữ Kỳ Diệu — Màn Hình Chơi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="firebase_config.js"></script>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
  :root {
    --tile: #1d4ed8;
    --tile-edge: #3b82f6;
    --key: #f59e0b;
    --key-edge: #fbbf24;
    --text: #f8fafc;
    --muted: #94a3b8;
    --panel: rgba(255,255,255,0.06);
    --panel-border: rgba(255,255,255,0.12);
    --cell: 60px;
    --gap: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Be Vietnam Pro', system-ui, sans-serif;
    color: var(--text); overflow: hidden;
    background: radial-gradient(1200px 600px at 20% -10%, #312e81 0%, transparent 60%),
                radial-gradient(1000px 500px at 100% 110%, #7c2d12 0%, transparent 55%),
                linear-gradient(160deg, #0f172a, #1e1b4b);
    display: flex; flex-direction: column;
  }

  /* ===== corner controls ===== */
  .corner {
    position: fixed; top: 14px; right: 16px; z-index: 50;
    display: flex; gap: 8px; opacity: .25; transition: opacity .25s;
  }
  .corner:hover { opacity: 1; }
  .corner .btn {
    border: 1px solid var(--panel-border); cursor: pointer; font-family: inherit;
    font-weight: 700; width: 42px; height: 42px; border-radius: 50%; font-size: 18px;
    display: grid; place-items: center;
    color: var(--text); background: rgba(15,23,42,.7); text-decoration: none;
    backdrop-filter: blur(8px);
  }
  .corner .btn:hover { background: rgba(255,255,255,.15); }

  /* ===== title ===== */
  .game-title {
    flex: 0 0 auto; text-align: center; padding: 18px 120px 6px;
    font-size: clamp(18px, 2.5vw, 36px); font-weight: 900; letter-spacing: 3px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #fde68a, #f59e0b, #fb923c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(245,158,11,.25);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ===== board ===== */
  .board-area {
    flex: 1 1 auto; display: grid; place-items: center;
    padding: 10px 20px; min-height: 0;
  }
  .board { display: flex; flex-direction: column; gap: var(--gap); }
  .row { display: flex; align-items: center; gap: var(--gap); transition: opacity .3s, filter .3s; }
  .row.failed { opacity: .45; filter: grayscale(.6); }
  .row-num {
    width: calc(var(--cell) * .8); height: calc(var(--cell) * .8);
    flex: 0 0 calc(var(--cell) * .8);
    border-radius: calc(var(--cell) * .18);
    display: grid; place-items: center;
    font-size: calc(var(--cell) * .38); font-weight: 900; color: #fff;
    background: linear-gradient(135deg,#7c3aed,#a855f7);
    box-shadow: 0 4px 14px rgba(168,85,247,.4);
    transition: box-shadow .3s, transform .3s;
  }
  .row.active .row-num { animation: pulse 1.2s infinite; transform: scale(1.08); }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(168,85,247,.65); }
    50% { box-shadow: 0 0 0 calc(var(--cell) * .22) rgba(168,85,247,0); }
  }

  .cells { display: flex; gap: var(--gap); }
  .cell { width: var(--cell); height: var(--cell); perspective: 600px; }
  .cell.gap { visibility: hidden; }
  .cell-inner {
    width: 100%; height: 100%; position: relative;
    transform-style: preserve-3d; transition: transform .6s cubic-bezier(.4,1.4,.6,1);
  }
  .cell.flipped .cell-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: calc(var(--cell) * .18);
    display: grid; place-items: center;
    font-size: calc(var(--cell) * .52); font-weight: 900;
    backface-visibility: hidden;
  }
  .face.front {
    background: linear-gradient(145deg, var(--tile-edge), var(--tile));
    box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 4px 10px rgba(0,0,0,.35);
  }
  .face.back {
    background: linear-gradient(145deg, #f1f5f9, #cbd5e1);
    color: #0f172a; transform: rotateY(180deg);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.8), 0 4px 10px rgba(0,0,0,.3);
  }
  .cell.keycol .face.front {
    background: linear-gradient(145deg, var(--key-edge), var(--key));
    box-shadow: inset 0 2px 0 rgba(255,255,255,.4), 0 4px 14px rgba(245,158,11,.45);
  }
  .cell.keycol .face.back {
    background: linear-gradient(145deg, #fde68a, #f59e0b);
    color: #451a03;
  }

  /* ===== question bar ===== */
  .question-bar {
    flex: 0 0 auto; margin: 6px auto 18px; max-width: min(1100px, 92vw);
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 18px; padding: 14px 26px; backdrop-filter: blur(12px);
    display: flex; align-items: center; gap: 16px;
    opacity: 0; transform: translateY(14px); transition: all .35s;
    min-height: 64px; visibility: hidden;
  }
  .question-bar.on { opacity: 1; transform: translateY(0); visibility: visible; }
  .q-badge {
    flex: 0 0 auto; padding: 8px 14px; border-radius: 12px; font-weight: 900;
    background: linear-gradient(135deg,#7c3aed,#a855f7); font-size: 15px; white-space: nowrap;
  }
  .q-text { font-size: clamp(15px, 1.6vw, 22px); font-weight: 600; line-height: 1.45; }

  /* ===== keyword overlay ===== */
  .kw-overlay {
    position: fixed; inset: 0; z-index: 80; display: none;
    place-items: center; background: rgba(5, 8, 22, .82); backdrop-filter: blur(6px);
  }
  .kw-overlay.on { display: grid; }
  .kw-box { text-align: center; animation: bounceIn .7s; padding: 20px; }
  .kw-label {
    font-size: clamp(16px, 2vw, 26px); letter-spacing: 8px; color: var(--muted);
    text-transform: uppercase; font-weight: 700; margin-bottom: 26px;
  }
  .kw-tiles { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .kw-tile {
    width: clamp(48px, 8vw, 96px); height: clamp(48px, 8vw, 96px);
    border-radius: 16px; display: grid; place-items: center;
    font-size: clamp(26px, 4.5vw, 54px); font-weight: 900; color: #451a03;
    background: linear-gradient(145deg, #fde68a, #f59e0b);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.5), 0 10px 30px rgba(245,158,11,.5);
    animation: popIn .5s backwards;
  }
  .kw-tile.space { background: none; box-shadow: none; width: clamp(20px, 3vw, 40px); }
  .kw-congrats {
    margin-top: 30px; font-size: clamp(20px, 3vw, 40px); font-weight: 900;
    background: linear-gradient(90deg,#fde68a,#f97316);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  @keyframes bounceIn {
    0% { transform: scale(.5); opacity: 0; }
    60% { transform: scale(1.06); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes popIn {
    0% { transform: scale(0) rotate(-10deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; }

  .empty-state { text-align: center; color: var(--muted); padding: 40px; }
  .empty-state h2 { color: var(--text); margin-bottom: 10px; }
  .empty-state a { color: #fbbf24; }
</style>
</head>
<body>

<div class="corner">
  <button class="btn" id="btnFs" title="Toàn màn hình">⛶</button>
</div>

<div class="game-title" id="gameTitle"></div>

<div class="board-area" id="boardArea">
  <div class="board" id="board"></div>
</div>

<div class="question-bar" id="questionBar">
  <div class="q-badge" id="qBadge"></div>
  <div class="q-text" id="qText"></div>
</div>

<div class="kw-overlay" id="kwOverlay">
  <div class="kw-box">
    <div class="kw-label">🔑 Từ khóa</div>
    <div class="kw-tiles" id="kwTiles"></div>
    <div class="kw-congrats">🏆 Chúc mừng!</div>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
const STORAGE_KEY = 'cnkd_game_data';
const STATE_KEY   = 'cnkd_play_state';

let firebaseDbRef = null;
let firebaseStateRef = null;
let firebaseDataRef = null;

function initFirebase() {
  if (window.FIREBASE_CONFIG) {
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(window.FIREBASE_CONFIG);
      }
      firebaseDbRef = firebase.database();
      firebaseStateRef = firebaseDbRef.ref(STATE_KEY);
      firebaseDataRef = firebaseDbRef.ref(STORAGE_KEY);
      
      // Lắng nghe thay đổi dữ liệu câu hỏi (bộ đề)
      firebaseDataRef.on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(val));
          boot(false); // Reload bảng
        }
      });

      // Lắng nghe thay đổi trạng thái ván chơi
      firebaseStateRef.on('value', (snapshot) => {
        const val = snapshot.val();
        const st = val || emptyState();
        applyState(st, true);
      });
      
      console.log("Firebase listener setup successfully.");
    } catch (e) {
      console.error("Firebase init failed:", e);
    }
  }
}
initFirebase();

const SAMPLE = {
  title: 'CHỦ ĐỀ: VIỆT NAM QUÊ HƯƠNG TÔI',
  keyword: 'VIETNAM',
  keywordHint: 'Từ khóa gồm 7 chữ cái — Đất nước hình chữ S thân yêu của chúng ta.',
  rows: [
    { question: 'Vịnh nào ở Quảng Ninh được UNESCO công nhận là Di sản thiên nhiên thế giới?', answer: 'VINH HA LONG', keyIndex: 0 },
    { question: 'Loại hình nghệ thuật sân khấu dân gian miền Bắc, biểu diễn trên mặt nước?', answer: 'MUA ROI NUOC', keyIndex: 6 },
    { question: 'Con đèo nổi tiếng được mệnh danh "Thiên hạ đệ nhất hùng quan", nối Huế và Đà Nẵng?', answer: 'DEO HAI VAN', keyIndex: 1 },
    { question: 'Dịp lễ cổ truyền quan trọng nhất trong năm của người Việt Nam?', answer: 'TET NGUYEN DAN', keyIndex: 0 },
    { question: 'Loài hoa được xem là Quốc hoa của Việt Nam?', answer: 'HOA SEN', keyIndex: 6 },
    { question: 'Nhạc cụ dân tộc chỉ có một dây duy nhất?', answer: 'DAN BAU', keyIndex: 1 },
    { question: 'Món cơm đặc sản nổi tiếng của Sài Gòn, ăn kèm sườn nướng?', answer: 'COM TAM', keyIndex: 2 },
  ]
};

let DATA = null;
let state = null;      // trạng thái hiện tại (do admin điều khiển)
let prevState = null;  // để tính diff -> hiệu ứng

/* ---------- data & state ---------- */
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { DATA = JSON.parse(raw); return; }
  } catch (e) {}
  DATA = SAMPLE;
}
function dataFingerprint(d) {
  return d.keyword + '|' + d.rows.map(r => r.answer + ':' + r.keyIndex).join('|');
}
function emptyState() {
  return { fp: dataFingerprint(DATA), cells: {}, failed: [], active: -1, kwSolved: false };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s.fp === dataFingerprint(DATA)) return s;
    }
  } catch (e) {}
  return emptyState();
}
function revealedIn(st, i) { return (st && st.cells && st.cells[i]) || []; }

/* ---------- layout ---------- */
function layout() {
  const maxLeft = Math.max(...DATA.rows.map(r => r.keyIndex));
  const maxRight = Math.max(...DATA.rows.map(r => r.answer.length - r.keyIndex));
  return { maxLeft, cols: maxLeft + maxRight };
}

function fitBoard() {
  if (!DATA.rows.length) return;
  const { cols } = layout();
  const nRows = DATA.rows.length;
  const area = document.getElementById('boardArea');
  const availW = area.clientWidth - 40;
  const availH = area.clientHeight - 20;
  const gap = Math.max(4, Math.min(10, Math.floor(availH / nRows * .12)));
  // tổng chiều ngang = badge(0.8c) + gap + cols*c + (cols-1)*gap
  const cw = (availW - gap * cols) / (cols + 0.8);
  const ch = (availH - gap * (nRows - 1)) / nRows;
  const cell = Math.max(24, Math.min(110, Math.floor(Math.min(cw, ch))));
  document.documentElement.style.setProperty('--cell', cell + 'px');
  document.documentElement.style.setProperty('--gap', gap + 'px');
}

/* ---------- render ---------- */
function renderBoard() {
  document.getElementById('gameTitle').textContent = DATA.title || 'Ô CHỮ BÍ MẬT';
  const { maxLeft, cols } = layout();
  const board = document.getElementById('board');
  board.innerHTML = '';
  DATA.rows.forEach((row, i) => {
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    rowEl.dataset.i = i;
    const num = document.createElement('div');
    num.className = 'row-num';
    num.textContent = i + 1;
    rowEl.appendChild(num);
    const cells = document.createElement('div');
    cells.className = 'cells';
    const offset = maxLeft - row.keyIndex;
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const ci = c - offset;
      if (ci < 0 || ci >= row.answer.length || row.answer[ci] === ' ') {
        cell.classList.add('gap');
      } else {
        cell.dataset.ci = ci;
        if (ci === row.keyIndex) cell.classList.add('keycol');
        cell.innerHTML = '<div class="cell-inner">' +
          '<div class="face front"></div>' +
          '<div class="face back">' + escapeHtml(row.answer[ci]) + '</div></div>';
      }
      cells.appendChild(cell);
    }
    rowEl.appendChild(cells);
    board.appendChild(rowEl);
  });
  fitBoard();
}

function applyState(newState, animate) {
  if (!newState) newState = emptyState();
  newState.failed = newState.failed || [];
  newState.cells = newState.cells || {};
  if (newState.active === undefined) newState.active = -1;

  const old = prevState || emptyState();
  DATA.rows.forEach((row, i) => {
    const rowEl = document.querySelector('.row[data-i="' + i + '"]');
    if (!rowEl) return;
    rowEl.classList.toggle('failed', newState.failed.includes(i));
    rowEl.classList.toggle('active', newState.active === i);
    const oldSet = new Set(revealedIn(old, i));
    const newSet = new Set(revealedIn(newState, i));
    let delay = 0;
    rowEl.querySelectorAll('.cell[data-ci]').forEach(cell => {
      const ci = Number(cell.dataset.ci);
      if (newSet.has(ci) && !oldSet.has(ci)) {
        if (animate) {
          const d = delay; delay += 120;
          setTimeout(() => { cell.classList.add('flipped'); beep(560 + ci * 25, .06); }, d);
        } else cell.classList.add('flipped');
      } else if (!newSet.has(ci) && oldSet.has(ci)) {
        cell.classList.remove('flipped');
      }
    });
  });

  // question bar
  const bar = document.getElementById('questionBar');
  if (newState.active >= 0 && DATA.rows[newState.active]) {
    const row = DATA.rows[newState.active];
    document.getElementById('qBadge').textContent =
      'Hàng ' + (newState.active + 1) + ' · ' + row.answer.replace(/\s/g,'').length + ' chữ cái';
    document.getElementById('qText').textContent = row.question;
    if (animate && old.active !== newState.active) beep(660, .09);
    bar.classList.add('on');
  } else {
    bar.classList.remove('on');
  }

  // keyword
  const overlay = document.getElementById('kwOverlay');
  if (newState.kwSolved) {
    if (!old.kwSolved) {
      const tiles = document.getElementById('kwTiles');
      tiles.innerHTML = '';
      DATA.keyword.toUpperCase().split('').forEach((ch, idx) => {
        const t = document.createElement('div');
        t.className = 'kw-tile' + (ch === ' ' ? ' space' : '');
        t.textContent = ch === ' ' ? '' : ch;
        t.style.animationDelay = (idx * .12) + 's';
        tiles.appendChild(t);
      });
      overlay.classList.add('on');
      if (animate) { confetti(); fanfare(); }
    }
  } else {
    overlay.classList.remove('on');
  }

  prevState = JSON.parse(JSON.stringify(newState));
}

/* ---------- live sync ---------- */
window.addEventListener('storage', e => {
  if (window.FIREBASE_CONFIG) return;
  if (e.key === STATE_KEY) {
    loadData(); // phòng khi fp đổi
    const st = loadState();
    applyState(st, true);
  } else if (e.key === STORAGE_KEY) {
    boot(false);
  }
});
window.addEventListener('resize', fitBoard);

/* ---------- sound ---------- */
let audioCtx = null;
function beep(freq, dur, delay) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime + (delay || 0);
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; o.type = 'sine';
    g.gain.setValueAtTime(.12, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}
function fanfare() { [523, 659, 784, 1047].forEach((f, i) => beep(f, .3, i * .15)); }

/* ---------- confetti ---------- */
function confetti() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = innerWidth; canvas.height = innerHeight;
  const colors = ['#f59e0b','#ef4444','#10b981','#3b82f6','#a855f7','#fde68a'];
  const parts = Array.from({length: 200}, () => ({
    x: Math.random() * canvas.width, y: -20 - Math.random() * canvas.height * .5,
    w: 6 + Math.random() * 8, h: 8 + Math.random() * 10,
    vy: 2 + Math.random() * 3.5, vx: -1.5 + Math.random() * 3,
    rot: Math.random() * Math.PI, vr: -.1 + Math.random() * .2,
    c: colors[Math.floor(Math.random() * colors.length)]
  }));
  let frame = 0;
  (function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    parts.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    if (++frame < 420) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  })();
}

/* ---------- misc ---------- */
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
document.getElementById('btnFs').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
};
document.addEventListener('fullscreenchange', () => setTimeout(fitBoard, 120));

/* ---------- init ---------- */
function boot(firstLoad) {
  loadData();
  if (!DATA || !DATA.rows || !DATA.rows.length) {
    document.getElementById('boardArea').innerHTML =
      '<div class="empty-state"><h2>Chưa có bộ câu hỏi nào</h2><p>Hãy vào <a href="admin.html">trang quản trị</a> để tạo bộ câu hỏi.</p></div>';
    return;
  }
  prevState = null;
  renderBoard();
  applyState(loadState(), false);
}
boot(true);
</script>
</body>
</html>
